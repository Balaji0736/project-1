<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Contact Us</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101322; color: #f7f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 7rem 1.25rem 3rem; display: grid; place-items: center; background: radial-gradient(ellipse at 18% 20%, rgb(113 82 255 / 20%), transparent 38%), radial-gradient(ellipse at 82% 78%, rgb(42 211 195 / 14%), transparent 36%), #101322; }
    .scene { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px); background-size: 54px 54px; mask-image: linear-gradient(to bottom, black, transparent 90%); }
    .nav { position: fixed; z-index: 1; top: 1.5rem; right: 1.5rem; display: flex; gap: .4rem; padding: .4rem; border: 1px solid rgb(255 255 255 / 12%); border-radius: 999px; background: rgb(16 19 34 / 72%); backdrop-filter: blur(12px); }
    .nav a { padding: .65rem .9rem; border-radius: 999px; color: #c5c8d9; font-size: .86rem; text-decoration: none; transition: background 180ms ease, color 180ms ease; }
    .nav a:hover, .nav a[aria-current="page"] { background: rgb(255 255 255 / 10%); color: #fff; }
    main { position: relative; width: min(100%, 760px); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid rgb(255 255 255 / 12%); border-radius: 32px; background: linear-gradient(145deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%)); box-shadow: 0 30px 100px rgb(0 0 0 / 35%), inset 0 1px rgb(255 255 255 / 10%); backdrop-filter: blur(18px); animation: rise-in 800ms cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 .8rem; color: #a8abc1; font-size: .76rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 8vw, 5.5rem); line-height: 1; letter-spacing: -.07em; background: linear-gradient(100deg, #fff 15%, #c9bdff 58%, #92f5e4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { max-width: 580px; margin: 1.5rem 0 2rem; color: #c2c4d4; font-size: 1.1rem; line-height: 1.75; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: grid; gap: .55rem; color: #d9daea; font-size: .9rem; font-weight: 600; }
    label.full { grid-column: 1 / -1; }
    input, textarea { width: 100%; border: 1px solid rgb(255 255 255 / 12%); border-radius: 12px; outline: none; background: rgb(10 12 25 / 42%); color: #fff; font: inherit; padding: .9rem 1rem; transition: border-color 180ms ease, box-shadow 180ms ease; }
    input:focus, textarea:focus { border-color: #a88bff; box-shadow: 0 0 0 3px rgb(168 139 255 / 15%); }
    textarea { min-height: 140px; resize: vertical; }
    button { justify-self: start; grid-column: 1 / -1; border: 0; border-radius: 999px; padding: .9rem 1.35rem; background: linear-gradient(100deg, #a88bff, #70e2d1); color: #111426; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .note { margin: 1.2rem 0 0; color: #9296ae; font-size: .85rem; line-height: 1.6; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 650px) { form { grid-template-columns: 1fr; } .nav { top: 1rem; right: 50%; transform: translateX(50%); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <nav class="nav" aria-label="Main navigation">
    <a href="hello-world.html">Home</a>
    <a href="about-us.html">About</a>
    <a href="contact-us.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <p class="eyebrow">Let’s talk</p>
    <h1>We’d love<br>to hear from you.</h1>
    <p class="intro">Have a question, an idea, or just want to say hello? Send us a note and we’ll be happy to connect.</p>
    <form action="mailto:hello@example.com" method="post" enctype="text/plain">
      <label>Name<input name="name" type="text" autocomplete="name" placeholder="Your name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="full">Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label>
      <button type="submit">Send a message <span aria-hidden="true">↗</span></button>
    </form>
    <p class="note">The contact form opens your email app to send the message. Replace hello@example.com with your email address to receive messages.</p>
  </main>
</body>
</html>
