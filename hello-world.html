<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101322">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101322;
      color: #f7f7fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 20%, rgb(113 82 255 / 20%), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgb(42 211 195 / 14%), transparent 36%),
        #101322;
    }

    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px),
                        linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    main {
      position: relative;
      width: min(90vw, 720px);
      padding: clamp(2.5rem, 8vw, 5.5rem) 2rem;
      text-align: center;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 32px;
      background: linear-gradient(145deg, rgb(255 255 255 / 9%), rgb(255 255 255 / 3%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%), inset 0 1px rgb(255 255 255 / 10%);
      backdrop-filter: blur(18px);
      animation: rise-in 900ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .sparkle {
      display: inline-grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin-bottom: 1.6rem;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 18px;
      background: linear-gradient(135deg, #a88bff, #5de5d1);
      color: #101322;
      font-size: 1.7rem;
      box-shadow: 0 10px 35px rgb(126 112 255 / 35%);
      transform: rotate(-7deg);
    }

    .eyebrow {
      margin: 0 0 .8rem;
      color: #a8abc1;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.4rem, 10vw, 6.5rem);
      line-height: 1;
      letter-spacing: -.075em;
      background: linear-gradient(100deg, #fff 15%, #c9bdff 58%, #92f5e4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .message {
      max-width: 440px;
      margin: 1.4rem auto 0;
      color: #b8bbce;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-top: 2rem;
      padding: .65rem 1rem;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 999px;
      background: rgb(10 12 25 / 35%);
      color: #d5d7e5;
      font-size: .82rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #67e8d1;
      box-shadow: 0 0 12px #67e8d1;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"></div>
  <main>
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow">A little something to start</p>
    <h1>Hello,<br>World! My Name is Balaji</h1>
    <p class="message">A bright new page, ready for whatever you dream up next.</p>
    <div class="tag"><span class="dot" aria-hidden="true"></span> Your journey starts here</div>
  </main>
</body>
</html>
